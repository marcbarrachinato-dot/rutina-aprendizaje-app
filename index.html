<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto de Aprendizaje - 1 Hora al Día</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; max-width: 650px; width: 100%; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); margin-bottom: 2rem; }
    
    /* Panel de Perfil */
    .profile-section { background: #1e293b; border: 1px solid #3b82f6; border-radius: 1rem; max-width: 650px; width: 100%; padding: 1.5rem; margin-bottom: 2rem; display: none; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    .profile-header { font-size: 1.5rem; font-weight: 800; color: #3b82f6; margin-bottom: 1.5rem; text-align: center; }
    .profile-stats { display: flex; gap: 0.75rem; justify-content: space-between; flex-wrap: wrap; }
    .stat-box { background: #0f172a; padding: 1rem 0.5rem; border-radius: 0.75rem; flex: 1; min-width: 80px; text-align: center; border: 1px solid #334155; }
    .stat-val { font-size: 1.5rem; font-weight: 800; color: #f8fafc; margin-bottom: 0.25rem; }
    .stat-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }

    /* Textos y Etiquetas */
    .tag { display: inline-block; background: #3b82f6; color: white; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; padding: 0.25rem 0.75rem; border-radius: 9999px; margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 1rem; color: #ffffff; }
    p.desc { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .box { background: #0f172a; border-left: 4px solid #3b82f6; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; }
    .box-title { font-size: 0.85rem; color: #64748b; text-transform: uppercase; font-weight: bold; margin-bottom: 0.25rem; }
    .box-text { color: #e2e8f0; font-weight: 600; }
    
    /* Formularios */
    input, textarea { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; resize: vertical; }
    button { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: none; font-weight: bold; cursor: pointer; margin-bottom: 0.5rem; transition: background 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-secondary { background: #475569; color: white; }
    .logout-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; margin-top: 1rem; }
    #msg { color: #ef4444; font-size: 0.875rem; margin-bottom: 1rem; text-align: center; }
    
    /* Sección Publicar */
    .publish-section { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #334155; }
    .publish-section h3 { font-size: 1.1rem; margin-bottom: 1rem; }
    
    /* El Muro / Feed */
    .feed-section { width: 100%; max-width: 650px; }
    .feed-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 1rem; color: #f8fafc; padding-left: 0.5rem; }
    .publicacion { background: #1e293b; border: 1px solid #334155; padding: 1.25rem; border-radius: 0.75rem; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .pub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .pub-author { font-weight: bold; color: #3b82f6; font-size: 0.95rem; }
    .pub-date { font-size: 0.75rem; color: #64748b; }
    .pub-content { color: #cbd5e1; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; }
    
    /* Botones de Votar */
    .pub-actions { display: flex; gap: 0.5rem; margin-top: 1rem; border-top: 1px solid #334155; padding-top: 0.75rem; }
    .btn-vote { flex: 1; padding: 0.5rem; background: #0f172a; border: 1px solid #334155; color: #f8fafc; cursor: pointer; border-radius: 0.5rem; font-size: 1.1rem; margin-bottom: 0; }
    .btn-vote:hover { background: #334155; }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div class="card" id="auth-container">
    <h1>Entrar al Reto</h1>
    <p class="desc">Únete para mantener tu racha y debatir con la comunidad.</p>
    <p id="msg"></p>
    <input type="email" id="email" placeholder="Tu correo electrónico">
    <input type="password" id="password" placeholder="Tu contraseña">
    <input type="text" id="username" placeholder="Nombre de usuario (Solo para registro)">
    <button class="btn-primary" onclick="login()">Iniciar Sesión</button>
    <button class="btn-secondary" onclick="registro()">Crearme una cuenta nueva</button>
  </div>

  <!-- DASHBOARD DE PERFIL -->
  <div class="profile-section" id="profile-section">
    <div class="profile-header" id="prof-name">@usuario</div>
    <div class="profile-stats">
      <div class="stat-box"><div class="stat-val" id="prof-racha">0</div><div class="stat-label">🔥 Racha</div></div>
      <div class="stat-box"><div class="stat-val" id="prof-max">0</div><div class="stat-label">🏆 Máxima</div></div>
      <div class="stat-box"><div class="stat-val" id="prof-pubs">0</div><div class="stat-label">📝 Aportes</div></div>
      <div class="stat-box"><div class="stat-val" id="prof-likes">0</div><div class="stat-label">👍 Likes</div></div>
      <div class="stat-box"><div class="stat-val" id="prof-dislikes">0</div><div class="stat-label">👎 Dislikes</div></div>
    </div>
  </div>

  <!-- PANTALLA DEL RETO Y PUBLICACIÓN -->
  <div class="card" id="app-container" style="display: none;">
    <div id="reto-content">Cargando el reto...</div>
    
    <div class="publish-section">
      <h3>¿Qué has aprendido hoy?</h3>
      <textarea id="conclusion-texto" rows="3" placeholder="Escribe aquí tu resumen o reflexión sobre el reto... (Mínimo 50 caracteres)"></textarea>
      <button class="btn-primary" onclick="enviarConclusion()">Publicar conclusión</button>
      <p id="msg-publicacion" style="font-size: 0.875rem; margin-top: 0.5rem; text-align: center;"></p>
    </div>

    <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
  </div>

  <!-- EL MURO (FEED) -->
  <div class="feed-section" id="feed-container" style="display: none;">
    <h2 class="feed-title">Conclusiones de la comunidad</h2>
    <div id="feed-content"></div>
  </div>

  <script>
    // ¡PON TUS CLAVES AQUÍ!
    const SUPABASE_URL = "https://seklglwsenfsefkjmotf.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_0Fza03ndiV9l0XPGPr9m9A_erhuMq3H"; 

    const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    clienteSupabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('profile-section').style.display = 'block';
        document.getElementById('app-container').style.display = 'block';
        document.getElementById('feed-container').style.display = 'block';
        cargarPerfil();
        cargarReto();
        cargarFeed();
      } else {
        document.getElementById('auth-container').style.display = 'block';
        document.getElementById('profile-section').style.display = 'none';
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('feed-container').style.display = 'none';
      }
    });

    async function cargarPerfil() {
      const { data: { user } } = await clienteSupabase.auth.getUser();
      if (!user) return;
      const { data, error } = await clienteSupabase.from('perfiles').select('*').eq('id', user.id).single();
      if (data) {
        document.getElementById('prof-name').innerText = '@' + data.nombre_usuario;
        document.getElementById('prof-racha').innerText = data.racha || 0;
        document.getElementById('prof-max').innerText = data.racha_maxima || 0;
        document.getElementById('prof-pubs').innerText = data.total_publicaciones || 0;
        document.getElementById('prof-likes').innerText = data.likes_recibidos || 0;
        document.getElementById('prof-dislikes').innerText = data.dislikes_recibidos || 0;
      }
    }

    async function registro() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value;
      const msgInfo = document.getElementById('msg');
      if (!username.trim()) { msgInfo.innerText = "Escribe un nombre de usuario."; return; }
      const { data, error } = await clienteSupabase.auth.signUp({ email, password });
      if (error) { msgInfo.innerText = error.message; return; }
      const { error: perfilError } = await clienteSupabase.from('perfiles').insert([ { id: data.user.id, nombre_usuario: username, racha: 0, racha_maxima: 0, total_publicaciones: 0, likes_recibidos: 0, dislikes_recibidos: 0 } ]);
      if (perfilError) msgInfo.innerText = "Error: " + perfilError.message;
      else { msgInfo.innerText = "¡Cuenta creada! Haz clic en Iniciar Sesión."; msgInfo.style.color = "#22c55e"; }
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await clienteSupabase.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('msg').innerText = "Correo o contraseña incorrectos.";
    }

    async function logout() { await clienteSupabase.auth.signOut(); }

    async function cargarReto() {
      const { data, error } = await clienteSupabase.from('retos').select('*').order('created_at', { ascending: false }).limit(1);
      const content = document.getElementById('reto-content');
      if (!data || data.length === 0) return content.innerHTML = '<h1>Aún no hay retos disponibles</h1>';
      const reto = data[0];
      content.innerHTML = `
        <span class="tag">${reto.categoria || 'General'}</span>
        <h1>${reto.titulo}</h1>
        <p class="desc">${reto.descripcion}</p>
        <div class="box"><div class="box-title">Objetivo / Pregunta Clave de Hoy</div><div class="box-text">${reto.pregunta_clave}</div></div>
      `;
    }

    async function enviarConclusion() {
      const texto = document.getElementById('conclusion-texto').value;
      const msgInfo = document.getElementById('msg-publicacion');
      const textoLimpio = texto.trim();
      
      if (textoLimpio.length < 50) { 
        msgInfo.innerText = "¡Muy corto! Escribe al menos 50 caracteres (llevas " + textoLimpio.length + ")."; 
        msgInfo.style.color = "#ef4444"; 
        return; 
      }
      
      msgInfo.innerText = "Publicando..."; msgInfo.style.color = "#94a3b8";
      const { data: { user } } = await clienteSupabase.auth.getUser();

      const { error: pubError } = await clienteSupabase.from('publicaciones').insert([ { contenido: texto, user_id: user.id } ]);
      if (pubError) { msgInfo.innerText = "Error: " + pubError.message; msgInfo.style.color = "#ef4444"; return; }

      const { data: perfil } = await clienteSupabase.from('perfiles').select('*').eq('id', user.id).single();
      
      if (perfil) {
        const ahora = new Date();
        const hoyInicio = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()).getTime();
        let nuevaRacha = perfil.racha || 0;
        
        if (perfil.ultima_publicacion) {
          const ultima = new Date(perfil.ultima_publicacion);
          const ultimaInicio = new Date(ultima.getFullYear(), ultima.getMonth(), ultima.getDate()).getTime();
          const diasDiferencia = (hoyInicio - ultimaInicio) / (1000 * 60 * 60 * 24);
          
          if (diasDiferencia === 1) nuevaRacha += 1; 
          else if (diasDiferencia > 1) nuevaRacha = 1; 
        } else { nuevaRacha = 1; }
        
        const nuevaMax = Math.max(perfil.racha_maxima || 0, nuevaRacha);
        const nuevoTotal = (perfil.total_publicaciones || 0) + 1;
        
        await clienteSupabase.from('perfiles').update({
          racha: nuevaRacha, racha_maxima: nuevaMax, total_publicaciones: nuevoTotal, ultima_publicacion: ahora.toISOString()
        }).eq('id', user.id);
      }

      msgInfo.innerText = "¡Publicado! 🎉"; msgInfo.style.color = "#22c55e"; 
      document.getElementById('conclusion-texto').value = ""; 
      cargarFeed(); cargarPerfil(); 
      setTimeout(() => msgInfo.innerText = "", 3000); 
    }

    // NUEVO: Función para votar
    async function votar(pubId, autorId, tipo) {
      const { data: { user } } = await clienteSupabase.auth.getUser();
      if (!user) return alert("Inicia sesión para votar.");

      // 1. Mirar si ya había votado a esta publicación
      const { data: votoPrevio } = await clienteSupabase
        .from('votos')
        .select('*')
        .eq('user_id', user.id)
        .eq('publicacion_id', pubId)
        .single();

      if (votoPrevio) {
        alert("Ya has votado en esta publicación.");
        return;
      }

      // 2. Registrar el nuevo voto
      await clienteSupabase.from('votos').insert([ { user_id: user.id, publicacion_id: pubId, tipo: tipo } ]);

      // 3. Sumar el punto al perfil del autor
      const { data: autor } = await clienteSupabase.from('perfiles').select('*').eq('id', autorId).single();
      if (autor) {
        if (tipo === 'like') {
          await clienteSupabase.from('perfiles').update({ likes_recibidos: (autor.likes_recibidos || 0) + 1 }).eq('id', autorId);
        } else {
          await clienteSupabase.from('perfiles').update({ dislikes_recibidos: (autor.dislikes_recibidos || 0) + 1 }).eq('id', autorId);
        }
      }
      
      cargarPerfil(); // Actualiza tu dashboard al instante por si te has votado a ti mismo
      alert("¡Voto registrado!");
    }

    async function cargarFeed() {
      // Ahora pedimos también el id de la publicación y el user_id del autor para que funcionen los botones
      const { data, error } = await clienteSupabase.from('publicaciones').select('id, user_id, contenido, created_at, perfiles(nombre_usuario)').order('created_at', { ascending: false });
      const feedContent = document.getElementById('feed-content');
      feedContent.innerHTML = "";
      
      if (error || !data || data.length === 0) { 
        feedContent.innerHTML = '<p style="color: #64748b; text-align: center; padding: 2rem;">Sé el primero en compartir tu conclusión hoy.</p>'; 
        return; 
      }
      
      data.forEach(pub => {
        const fecha = new Date(pub.created_at).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        const nombre = pub.perfiles ? pub.perfiles.nombre_usuario : 'Usuario Anónimo';
        
        feedContent.innerHTML += `
          <div class="publicacion">
            <div class="pub-header"><span class="pub-author">@${nombre}</span><span class="pub-date">${fecha}</span></div>
            <div class="pub-content">${pub.contenido}</div>
            
            <!-- NUEVO: Botones de Voto -->
            <div class="pub-actions">
              <button class="btn-vote" onclick="votar(${pub.id}, '${pub.user_id}', 'like')">👍 Me gusta</button>
              <button class="btn-vote" onclick="votar(${pub.id}, '${pub.user_id}', 'dislike')">👎 No me gusta</button>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
